# opencode-proxy-go —— 远程测试配置（Debian 12 / 直连出站）
#
# 部署路径：/opt/opencode-proxy-go
# 客户端请求 {listen}{path} → https://opencode.ai/zen/*（代理内部重写）
#
# 2026-10-18：live catalog 的 /inference/* 匿名直连已 403，本代理统一重写回
# Console 兼容层 /zen/*；裸 /v1/* 与旧 /inference/v1/* 也走 /zen/*。

listen: "127.0.0.1:8788"
upstream: "https://opencode.ai"

# 会话/消息映射持久化（相对路径基于 systemd WorkingDirectory）
db_path: "proxy-go.db"

# 远程测试暂不做前缀剥离
strip_prefix: ""

# 远程服务器直连 opencode.ai；不使用本地 Mihomo/环境变量代理
proxy:
  url: ""
  no_proxy: []
  from_env: false

# Bun 1.3.14 出站 sidecar（上游 TLS/HTTP2 指纹门）
forwarder:
  addr: "127.0.0.1:8898"

# 入站 session key 识别：OpenCode 客户端优先使用 x-opencode-session-id / x-session-affinity
session:
  headers:
    - x-opencode-session-id
    - x-session-affinity
    - x-session-id
    - x-opencode-session
    - x-session
  fallback_key: "default"
  passthrough_native: true

# 入站 message key（msg_ 不上行，仅审计）
message:
  headers:
    - x-message-id
  passthrough_native: true

# 注入上游的 opencode v2 身份头
upstream_headers:
  user_agent: "opencode/latest/2.0.32/cli"
  authorization: "Bearer public"
  client: "cli"
  project: "global"

# body 修正：v2 = 强制 stream:true + 补齐 read 工具
body_fixup:
  mode: "v2"
  template_file: "opencode_system_prompt.txt"
  agent_template_file: "opencode_agent_system_prompt.txt"
  tools_file: "opencode_tools.json"

# 请求审计
log:
  requests: true
  keep_days: 7
